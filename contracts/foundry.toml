[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = false

[fuzz]
runs = 10000

[invariant]
runs = 256
# Deep enough that a run can actually build a multi-level tree before it starts
# revoking and reclaiming it; at depth 32 most runs never got past two nodes.
depth = 96
fail_on_revert = false

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"
