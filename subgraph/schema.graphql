type Agent @entity(immutable: false) {
  id: ID!
  label: String
  owner: Bytes
  parent: Agent
  children: [Agent!]! @derivedFrom(field: "parent")
  capabilities: BigInt!
  spendCap: BigInt!
  spendRemaining: BigInt!
  queryBudget: BigInt!
  queryRemaining: BigInt!
  expiry: BigInt!
  maxDepth: Int!
  readOnly: Boolean!
  depth: Int!
  subregistry: Bytes
  epoch: BigInt!
  revoked: Boolean!
  reclaimed: Boolean!
  isRoot: Boolean!
  createdAt: BigInt!
  executions: [Execution!]! @derivedFrom(field: "agent")
}

type Escalation @entity(immutable: true) {
  id: ID!
  attemptedBy: Bytes!
  label: String!
  reason: String!
  proposedCapabilities: BigInt!
  proposedSpendCap: BigInt!
  proposedExpiry: BigInt!
  blockNumber: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

type Execution @entity(immutable: true) {
  id: ID!
  agent: Agent!
  capBit: Int!
  queryCost: BigInt!
  target: Bytes!
  spend: BigInt!
  timestamp: BigInt!
  txHash: Bytes!
}

type BudgetFlow @entity(immutable: true) {
  id: ID!
  from: Agent
  to: Agent
  amount: BigInt!
  queryAmount: BigInt!
  kind: String!
  timestamp: BigInt!
  txHash: Bytes!
}

type Stats @entity(immutable: false) {
  id: ID!
  agentsGranted: BigInt!
  agentsRevoked: BigInt!
  escalationsBlocked: BigInt!
  executions: BigInt!
  totalSpent: BigInt!
  maxDepthSeen: Int!
}
