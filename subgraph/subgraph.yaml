specVersion: 1.0.0
description: Attenuate permission tree
repository: TODO
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: AttenuatedSubregistry
    network: sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: AttenuatedSubregistry
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mapping.ts
      entities: [Agent, Escalation, BudgetFlow]
      abis:
        - name: AttenuatedSubregistry
          file: ../contracts/out/AttenuatedSubregistry.sol/AttenuatedSubregistry.json
      eventHandlers:
        - event: Granted(indexed bytes32,indexed bytes32,string,address,(uint256,uint256,uint256,uint256,uint256,uint64,uint16,bool,bool,bool,bytes32,uint64,uint64))
          handler: handleGranted
        - event: Revoked(indexed bytes32,uint64)
          handler: handleRevoked
        - event: Reclaimed(indexed bytes32,indexed bytes32,uint256,uint256)
          handler: handleReclaimed
        - event: EscalationBlocked(indexed bytes32,indexed address,string,(uint256,uint256,uint256,uint256,uint256,uint64,uint16,bool,bool,bool,bytes32,uint64,uint64),string,uint256)
          handler: handleEscalationBlocked
  - kind: ethereum/contract
    name: Executor
    network: sepolia
    source:
      address: "0x0000000000000000000000000000000000000000"
      abi: Executor
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/mapping.ts
      entities: [Agent, BudgetFlow]
      abis:
        - name: Executor
          file: ../contracts/out/Executor.sol/Executor.json
      eventHandlers:
        - event: Executed(indexed bytes32,indexed uint8,address,uint256)
          handler: handleExecuted
